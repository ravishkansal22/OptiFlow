<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OptiFlow — decide where to put your warehouses. Evidence-backed siting, cost-vs-resilience trade-offs, and disruption stress tests." />
    <meta name="theme-color" content="#FAFAF9" />
    <title>OptiFlow — Logistics Network Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('optiflow-theme');
        if (t === 'dark' || (t === null && window.matchMedia('(prefers-color-scheme: dark)').matches && localStorage.getItem('optiflow-theme-auto') === '1')) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
